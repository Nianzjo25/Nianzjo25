<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#08182B" />
    </linearGradient>

    <!-- Cyan Neon Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00D9FF" stroke-width="0.7" stroke-opacity="0.07" />
      <circle cx="30" cy="0" r="1" fill="#00D9FF" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <rect width="900" height="240" rx="16" fill="url(#grid)" />

  <!-- Decorative Glowing Waves/Orbs -->
  <circle cx="820" cy="40" r="140" fill="#00D9FF" opacity="0.08" filter="url(#glow)" />
  <circle cx="60" cy="200" r="100" fill="#0284C7" opacity="0.07" filter="url(#glow)" />

  <!-- Abstract Code Elements / Cyber Lines -->
  <path d="M 0 215 C 200 185, 450 245, 900 205" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.4" />
  <path d="M 0 225 C 250 200, 550 250, 900 218" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.2" />

  <!-- Terminal Dot Header Bar -->
  <g transform="translate(35, 25)">
    <circle cx="0" cy="0" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="16" cy="0" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="32" cy="0" r="5" fill="#10B981" opacity="0.8" />
    <text x="50" y="4" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">nianzjo.com ~ profile</text>
  </g>

  <!-- Main Content Centered -->
  <!-- Name -->
  <g transform="translate(450, 95)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="url(#cyanGrad)" letter-spacing="4" filter="url(#subtleGlow)">
      NIANZ JO
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(450, 132)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="url(#subGrad)" letter-spacing="2">
      DÉVELOPPEUR FULL STACK | BACKEND &amp; API ARCHITECTURE
    </text>
  </g>

  <!-- Tech Badges / Pills in Banner -->
  <g transform="translate(450, 172)" text-anchor="middle">
    <!-- Tag 1 -->
    <rect x="-310" y="0" width="80" height="26" rx="13" fill="#0F172A" stroke="#00D9FF" stroke-opacity="0.3" stroke-width="1"/>
    <text x="-270" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">Python</text>

    <!-- Tag 2 -->
    <rect x="-218" y="0" width="80" height="26" rx="13" fill="#0F172A" stroke="#00D9FF" stroke-opacity="0.3" stroke-width="1"/>
    <text x="-178" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">Django</text>

    <!-- Tag 3 -->
    <rect x="-126" y="0" width="80" height="26" rx="13" fill="#0F172A" stroke="#00D9FF" stroke-opacity="0.3" stroke-width="1"/>
    <text x="-86" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">FastAPI</text>

    <!-- Tag 4 -->
    <rect x="-34" y="0" width="68" height="26" rx="13" fill="#0F172A" stroke="#00D9FF" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">PHP</text>

    <!-- Tag 5 -->
    <rect x="46" y="0" width="80" height="26" rx="13" fill="#0F172A" stroke="#00D9FF" stroke-opacity="0.3" stroke-width="1"/>
    <text x="86" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">Laravel</text>

    <!-- Tag 6 -->
    <rect x="138" y="0" width="80" height="26" rx="13" fill="#0F172A" stroke="#00D9FF" stroke-opacity="0.3" stroke-width="1"/>
    <text x="178" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">React</text>

    <!-- Tag 7 -->
    <rect x="230" y="0" width="80" height="26" rx="13" fill="#0F172A" stroke="#00D9FF" stroke-opacity="0.3" stroke-width="1"/>
    <text x="270" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">Docker</text>
  </g>

  <!-- Border Frame -->
  <rect width="900" height="240" rx="16" fill="none" stroke="#00D9FF" stroke-width="1.5" stroke-opacity="0.25" />
</svg>
